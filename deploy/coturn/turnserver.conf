# ---------------------------------------------------------------------------
# KeyMessage TURN — PLANTILLA
#
# Este fichero NO lleva secretos. El entrypoint sustituye __TURN_*__ por las
# variables del fichero de entorno (0600, fuera del repo) antes de arrancar
# coturn. Copiarlo NO basta: sin esas variables el arranque falla a proposito.
#
# Puertos: 3479/udp+tcp (STUN/TURN) y 5350/tcp (TLS, solo si hay certificado).
# Se usan 3479/5350 —y no 3478/5349— para convivir con un coturn nativo que ya
# escuche en los estandar; un cliente se configura por entorno y no le importa
# el numero.
# ---------------------------------------------------------------------------

listening-port=3479
# Para TLS, descomentar SOLO con certificado y clave legibles por el contenedor.
# 5350 evita el choque con un coturn nativo; para atravesar redes que filtran
# UDP se puede usar 443/tcp (requiere privilegio de puerto bajo o un proxy TLS
# delante; ver deploy/coturn/README.md).
# tls-listening-port=5350
# cert=/etc/keymessage/tls/fullchain.pem
# pkey=/etc/keymessage/tls/privkey.pem

listening-ip=0.0.0.0
min-port=55000
max-port=55999

# STUN con huella y sin credenciales; TURN con autenticacion por SECRETO
# COMPARTIDO (mecanismo REST de coturn).
#
# POR QUE NO HAY `user=` ESTATICO
#   Con `static-auth-secret` (equivalente a `use-auth-secret`), coturn autentica
#   UNICAMENTE credenciales efimeras: username="<expiry>:<etiqueta>" y
#   credential=base64(HMAC-SHA1(secreto, username)). Un `user=` en este fichero
#   se IGNORA y el cliente recibe "Cannot find credentials of user <...>".
#   Por eso el usuario estatico se elimino: tener las dos cosas parecia
#   configurado y no autenticaba.
fingerprint
lt-cred-mech
use-auth-secret
realm=__TURN_REALM__
static-auth-secret=__TURN_SECRET__
stale-nonce=600

# Sin consola interactiva y sin rangos que conviertan el TURN en un proxy hacia
# la red interna del host.
no-cli
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Cuotas: un cliente no puede acaparar el relay. Ajustar si hay mas pares.
user-quota=12
total-quota=1200

# Log a stdout para que `docker logs` sea la unica fuente.
log-file=stdout
simple-log
