# Timeouts para tests WebRTC reales.
# Los callbacks nativos son asincronos y la negociacion ICE lleva tiempo
# real (host candidates + DTLS + SCTP). Ningun test debe colgarse, pero
# tampoco debe fallar por latencia razonable.
junit.jupiter.execution.timeout.default = 120 s
junit.jupiter.execution.timeout.mode = enabled
