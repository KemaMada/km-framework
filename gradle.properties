org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.disallowKotlinSourceSets=false

# NO se fija aqui `org.gradle.java.home`. Es una ruta ABSOLUTA especifica de
# cada maquina y no debe viajar en el repositorio: hardcodearla rompe el clon
# de cualquiera que tenga el JDK en otra ruta, y rompe CI. Lo que vive en
# versionado son SOLO las opciones portables de arriba; la ruta del JDK va en
#
#     ~/.gradle/gradle.properties          (esta maquina, no versionado)
#
# que tiene PRECEDENCIA sobre este archivo, o se pasa en la invocacion:
#
#     ./gradlew -Dorg.gradle.java.home=/ruta/al/jdk :km-core:assemble
#
# Precedente del proyecto: `KemaMada-km-android/gradle.properties` aplica
# exactamente esta politica, con este mismo comentario.
