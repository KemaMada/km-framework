# Binding de SLF4J para km-desktop.
#
# Escribe en stderr, NUNCA en stdout: stdout es el prompt de la TUI y una linea
# de log ahi parte la edicion de la linea que el usuario esta escribiendo.
#
# El nivel por defecto es `warn`. La traza fina del transporte se activa con
# `--verbose`, que escribe por stderr explicitamente y no depende de este ajuste.
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
